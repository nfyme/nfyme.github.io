 <script type="module">
import PhotoSwipeLightbox from './js/photoswipe-lightbox.esm.js';

let deepZoomPlugin;

const lightbox = new PhotoSwipeLightbox({
    gallery: '#gallery',
    children: '.pswp-gallery__item > a',

    pswpModule: () => import('./js/photoswipe.esm.js'),

    openPromise: () => {
        if (!deepZoomPlugin) {
            return import('./src/index.js').then((module) => {
                deepZoomPlugin = new module.default(lightbox, {
                });
            });
        }
    },

    allowPanToNext: false,
    allowMouseDrag: true,
    wheelToZoom: true,
    zoom: false
});

lightbox.init();
</script>
